<h2 mat-dialog-title>{{ isEditMode ? 'Editar perfil' : 'Nuevo perfil' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" />
      @if (form.controls.name.hasError('required') && form.controls.name.touched) {
        <mat-error>El nombre es requerido</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Secciones</mat-label>
      <mat-select formControlName="section_ids" multiple>
        @for (section of sections(); track section.id) {
          <mat-option [value]="section.id">{{ section.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-button mat-dialog-close [disabled]="saving()">Cancelar</button>
    <button type="submit" mat-flat-button color="primary" [disabled]="saving()">
      @if (saving()) {
        <mat-progress-spinner diameter="18" mode="indeterminate" />
      } @else {
        <span>Guardar</span>
      }
    </button>
  </mat-dialog-actions>
</form>
