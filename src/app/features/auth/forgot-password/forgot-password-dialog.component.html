<h2 mat-dialog-title>Recuperar contrasena</h2>
<mat-dialog-content>
  <p>Ingresa tu correo y te enviaremos las instrucciones para restablecer tu contrasena.</p>
  <mat-form-field class="full-width" appearance="outline">
    <mat-label>Correo electronico</mat-label>
    <input matInput type="email" [formControl]="email" (keyup.enter)="send()" />
    @if (email.hasError('required')) {
      <mat-error>El correo es requerido</mat-error>
    }
    @if (email.hasError('email')) {
      <mat-error>Ingresa un correo valido</mat-error>
    }
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="sending()">Cancelar</button>
  <button mat-flat-button color="primary" [disabled]="sending()" (click)="send()">
    @if (sending()) {
      <mat-progress-spinner diameter="18" mode="indeterminate" />
    } @else {
      <span>Enviar</span>
    }
  </button>
</mat-dialog-actions>
